version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: nutrichef-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nutrichef}
      POSTGRES_USER: ${DB_USER:-nutrichef}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nutrichef-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nutrichef-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-nutrichef}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-nutrichef}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      UPLOAD_DIR: ./uploads/inventory
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - nutrichef-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nutrichef-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - nutrichef-network

volumes:
  postgres_data:
    driver: local

networks:
  nutrichef-network:
    driver: bridge
